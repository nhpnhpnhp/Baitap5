server.port=8090
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# View resolver cho JSP
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Load bien moi truong / file .runtime/db.properties neu co
spring.config.import=optional:file:.runtime/db.properties

# Ket noi SQL Server
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=Baitap12;encrypt=true;trustServerCertificate=true;loginTimeout=5}
spring.datasource.username=${DB_USER:baitap12_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# SiteMesh 3 (spring-boot-starter-sitemesh 3.3.0)
sitemesh.integration=view-resolver
sitemesh.decorator.prefix=/WEB-INF/decorators/
sitemesh.decorator.default=main.jsp
sitemesh.decorator.exclusions=/assets/*,/api/**
